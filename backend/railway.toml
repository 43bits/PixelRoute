[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements.txt && pip install -r requirements-ml.txt --no-deps --ignore-requires-python || true && npm install && python -m prisma generate"

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
